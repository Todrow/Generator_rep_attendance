name: Генерация табелей явки

on:
  schedule:
    # Каждый понедельник в 08:00 по московскому времени (05:00 UTC)
    # Понедельник 18:00 МСК (15:00 UTC) и Вторник 18:00 МСК (15:00 UTC)
    - cron: '0 15 * * 1,2'
    # Вторник 08:15 МСК (05:15 UTC)
    - cron: '15 5 * * 2'
    # Среда 17:00 МСК (14:00 UTC)
    - cron: '0 14 * * 3'
    # Суббота 09:45 МСК (06:45 UTC)
    - cron: '45 6 * * 6'

  # Можно запустить вручную из интерфейса GitHub
  workflow_dispatch:

jobs:
  generate-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установить зависимости
        run: pip install openpyxl requests

      - name: Запустить скрипт
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_SENDER:       ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:     ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER:     ${{ secrets.EMAIL_RECEIVER }}
        run: python generate_reports.py
